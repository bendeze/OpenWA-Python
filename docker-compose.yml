# OpenWA Engine - Local Development Setup
# Runs the official upstream OpenWA engine container for local bot testing.

services:
  openwa-engine:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: openwa-engine
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      # Rate limiting and security defaults
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW_MS=60000
    volumes:
      - openwa_data:/app/data

volumes:
  openwa_data:
    name: openwa_data
